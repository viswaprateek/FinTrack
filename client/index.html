<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        if (!localStorage.getItem('fintrack-theme-light-default-v1')) {
          localStorage.setItem('fintrack-theme', 'light');
          localStorage.setItem('fintrack-theme-light-default-v1', '1');
        }
        var theme = localStorage.getItem('fintrack-theme');
        if (theme !== 'light' && theme !== 'dark') theme = 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
